<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <title>至急配薬ログ</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
           margin: 0; background:#f6f7f8; color:#111; }
    header { background:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
             border-bottom:1px solid #e6e6e6; position:sticky; top:0; z-index:10; }
    .wrap { padding:16px; max-width:560px; margin:0 auto; }
    .card { background:#fff; border:1px solid #e6e6e6; border-radius:14px; padding:14px; margin-bottom:12px; }
    .row { display:flex; gap:10px; }
    .row > div { flex:1; }
    label { display:block; font-size:12px; color:#555; margin-bottom:6px; }
    input, select, textarea { width:100%; padding:10px 12px; font-size:16px; border:1px solid #d9d9d9; border-radius:10px; background:#fff; box-sizing:border-box; }
    textarea { min-height:64px; resize:vertical; }
    .btnrow { display:flex; gap:10px; }
    button { width:100%; padding:14px 12px; font-size:16px; border-radius:12px; border:1px solid #d9d9d9; background:#fff; }
    button.primary { background:#111; color:#fff; border-color:#111; }
    button:disabled { opacity:.45; }
    .meta { font-size:14px; color:#333; line-height:1.7; }
    .status { font-weight:700; }
    .hint { font-size:12px; color:#777; margin-top:6px; }
    .ok { color:#0a7a2f; }
    .ng { color:#c01919; }
    .stop { border:1px solid #ececec; border-radius:12px; padding:12px; margin-top:10px; }
    .stopHead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .pill { font-size:12px; color:#555; background:#f0f0f0; padding:4px 8px; border-radius:999px; }
  </style>

  <script>
    // ✅ ここが重要：onclickで確実に開くトグル関数（イベント登録不要）
    function toggleSettings() {
      const card = document.getElementById("settings");
      if (!card) return;
      card.style.display = (card.style.display === "none" || card.style.display === "") ? "block" : "none";
    }
  </script>
</head>
<body>
<header>
  <div>至急配薬ログ</div>
  <!-- ✅ onclick直書きで確実に反応 -->
  <button style="width:auto;padding:10px 12px;" onclick="toggleSettings()">⚙</button>
</header>

<div class="wrap">
  <div class="card">
    <div class="meta">
      今日：<span id="today"></span><br/>
      スタッフ：<span id="who">（未設定）</span><br/>
      ステータス：<span class="status" id="status">未開始</span>
    </div>
    <div class="hint" id="facilityLoadStatus"></div>
    <div class="hint" id="jsAlive" class="ok"></div>
  </div>

  <div class="card">
    <div class="meta">
      出発時刻：<span id="startTime">--:--</span><br/>
      帰社時刻：<span id="endTime">--:--</span><br/>
      所要時間：<span id="duration">--</span> 分
    </div>
    <div class="btnrow" style="margin-top:12px;">
      <button class="primary" id="btnStart" type="button">🚑 出発（開始）</button>
      <button id="btnEnd" type="button" disabled>🏁 帰社（終了）</button>
    </div>
    <div class="hint">出発→帰社はワンタップ。施設明細は後から入力OK。</div>
  </div>

  <div class="card">
    <div class="stopHead">
      <div class="meta" style="margin:0;">施設明細（最大5件）</div>
      <div class="pill" id="stopCountPill">0/5</div>
    </div>

    <datalist id="facilityList"></datalist>
    <div id="stops"></div>

    <div class="btnrow" style="margin-top:12px;">
      <button id="btnAddStop" type="button">＋ 施設を追加</button>
      <button id="btnClearStops" type="button">クリア</button>
    </div>

    <div class="hint">施設は検索で選べます。候補が無ければそのまま手入力もOK（表記ゆれ注意）。</div>
  </div>

  <div class="card">
    <label>メモ（任意）</label>
    <textarea id="memo" placeholder="例：医師追加処方／急変／不足対応／夜間など"></textarea>
  </div>

  <div class="card">
    <button class="primary" id="btnSave" disabled type="button">💾 保存（シートへ送信）</button>
    <div class="hint">保存後に自動でリセットします</div>
    <div id="result" class="hint"></div>
  </div>

  <!-- ✅ 設定カード（toggleSettingsで開閉） -->
  <div class="card" id="settings" style="display:none;">
    <div class="row">
      <div>
        <label>店舗</label>
        <select id="store">
          <option value="市川店">市川店</option>
          <option value="千葉店">千葉店</option>
          <option value="練馬店">練馬店</option>
        </select>
      </div>
    </div>

    <div style="margin-top:10px;">
      <label>スタッフ名（必須）</label>
      <input id="staffName" placeholder="例：石原" />
    </div>

    <div style="margin-top:10px;">
      <label>送信先URL（GAS WebアプリURL）</label>
      <input id="endpoint" placeholder="https://script.google.com/macros/s/....../exec" />
      <div class="hint">このURLから施設マスタも読み込みます（JSONP）。</div>
    </div>

    <div class="btnrow" style="margin-top:12px;">
      <button id="btnSaveSettings" class="primary" type="button">設定を保存</button>
      <button type="button" onclick="toggleSettings()">閉じる</button>
    </div>
  </div>
</div>

<script>
  // --- service worker (optional) ---
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }

  // helpers
  const pad = n => String(n).padStart(2,"0");
  const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const fmtDate = d => `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  const weekdays = ["日","月","火","水","木","金","土"];
  const el = id => document.getElementById(id);

  // state
  let startAt = null;
  let endAt = null;
  let facilities = [];
  let stops = [];
  const MAX_STOPS = 5;

  // DOM
  const todayEl = el("today");
  const whoEl = el("who");
  const statusEl = el("status");
  const facilityLoadStatusEl = el("facilityLoadStatus");
  const jsAliveEl = el("jsAlive");

  const startTimeEl = el("startTime");
  const endTimeEl = el("endTime");
  const durationEl = el("duration");

  const btnStart = el("btnStart");
  const btnEnd = el("btnEnd");
  const btnSave = el("btnSave");
  const resultEl = el("result");

  const stopsEl = el("stops");
  const btnAddStop = el("btnAddStop");
  const btnClearStops = el("btnClearStops");
  const stopCountPill = el("stopCountPill");

  const facilityListEl = el("facilityList");
  const memoEl = el("memo");

  // settings inputs
  const storeEl = el("store");
  const staffNameEl = el("staffName");
  const endpointEl = el("endpoint");
  const btnSaveSettings = el("btnSaveSettings");

  // init
  const now = new Date();
  todayEl.textContent = `${fmtDate(now)} (${weekdays[now.getDay()]})`;
  jsAliveEl.innerHTML = `<span class="ok">JS起動OK</span>`;

  function getSettings() { return JSON.parse(localStorage.getItem("urgentDeliverySettings") || "{}"); }
  function setSettings(s) { localStorage.setItem("urgentDeliverySettings", JSON.stringify(s)); }

  function setStatus(text) { statusEl.textContent = text; }

  function updateTimes() {
    startTimeEl.textContent = startAt ? fmtTime(startAt) : "--:--";
    endTimeEl.textContent = endAt ? fmtTime(endAt) : "--:--";
    durationEl.textContent = (startAt && endAt) ? String(Math.max(0, Math.round((endAt-startAt)/60000))) : "--";
  }

  function updateWho() {
    const s = getSettings();
    whoEl.textContent = s.staffName ? s.staffName : "（未設定）";
  }

  function updateStopCount() {
    stopCountPill.textContent = `${stops.length}/${MAX_STOPS}`;
    btnAddStop.disabled = stops.length >= MAX_STOPS;
  }

  function canSave() {
    const s = getSettings();
    if (!s.staffName || !s.endpoint) return false;
    if (!(startAt && endAt)) return false;
    return stops.some(st => (st.facility || "").trim() !== "");
  }

  function updateSaveButton() { btnSave.disabled = !canSave(); }

  function escapeHtml(str) {
    return (str||"").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  }

  function renderStops() {
    stopsEl.innerHTML = "";
    stops.forEach((st, idx) => {
      const n = idx + 1;
      const wrap = document.createElement("div");
      wrap.className = "stop";
      wrap.innerHTML = `
        <div class="stopHead">
          <div class="meta" style="margin:0;">${n}件目</div>
          <button type="button" data-remove="${idx}" style="width:auto;padding:8px 10px;">削除</button>
        </div>

        <label>施設（検索して選択）</label>
        <input type="text" list="facilityList" placeholder="施設名を入力/選択"
               data-field="facility" data-idx="${idx}" value="${escapeHtml(st.facility)}">

        <div class="row" style="margin-top:10px;">
          <div>
            <label>件数</label>
            <input type="number" min="0" inputmode="numeric" data-field="cases" data-idx="${idx}" value="${st.cases ?? 1}">
          </div>
          <div>
            <label>現地薬剤セット</label>
            <select data-field="on_site_set" data-idx="${idx}">
              <option value="" ${st.on_site_set===""?"selected":""}>未選択</option>
              <option value="あり" ${st.on_site_set==="あり"?"selected":""}>あり</option>
              <option value="なし" ${st.on_site_set==="なし"?"selected":""}>なし</option>
            </select>
          </div>
        </div>
      `;
      stopsEl.appendChild(wrap);
    });

    stopsEl.querySelectorAll("button[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = Number(btn.getAttribute("data-remove"));
        stops.splice(i, 1);
        renderStops();
        updateStopCount();
        updateSaveButton();
      });
    });

    stopsEl.querySelectorAll("[data-field]").forEach(inp => {
      inp.addEventListener("input", () => {
        const i = Number(inp.getAttribute("data-idx"));
        const f = inp.getAttribute("data-field");
        if (!stops[i]) return;
        stops[i][f] = (f === "cases") ? Number(inp.value || 0) : inp.value;
        updateSaveButton();
      });
      inp.addEventListener("change", updateSaveButton);
    });
  }

  function addStop() {
    if (stops.length >= MAX_STOPS) return;
    stops.push({ facility:"", cases:1, on_site_set:"" });
    renderStops(); updateStopCount(); updateSaveButton();
  }

  function clearStops() {
    stops = [];
    renderStops(); updateStopCount(); updateSaveButton();
  }

  function buildFacilityDatalist() {
    facilityListEl.innerHTML = "";
    facilities.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      facilityListEl.appendChild(opt);
    });
  }

  // JSONP (CORS回避)
  function loadFacilitiesFromGAS() {
    const s = getSettings();
    if (!s.endpoint) {
      facilityLoadStatusEl.innerHTML = `<span class="ng">⚙で送信先URL（GAS）を設定すると施設候補が読み込まれます</span>`;
      return;
    }
    facilityLoadStatusEl.textContent = "施設マスタ読込中…";

    const cbName = "cbFacilities_" + Math.random().toString(16).slice(2);
    window[cbName] = function(list) {
      try {
        facilities = Array.isArray(list) ? list : [];
        buildFacilityDatalist();
        facilityLoadStatusEl.innerHTML = facilities.length
          ? `<span class="ok">施設マスタ読み込み：${facilities.length}件</span>`
          : `<span class="ng">facility_masterが空です</span>`;
      } finally {
        delete window[cbName];
      }
    };

    const script = document.createElement("script");
    script.src = s.endpoint + "?callback=" + encodeURIComponent(cbName) + "&_ts=" + Date.now();
    script.onerror = () => {
      facilityLoadStatusEl.innerHTML = `<span class="ng">施設マスタ読込失敗（GAS doGet/再デプロイ/URL確認）</span>`;
      delete window[cbName];
    };
    document.body.appendChild(script);
  }

  // events
  btnStart.addEventListener("click", () => {
    startAt = new Date();
    endAt = null;
    btnStart.disabled = true;
    btnEnd.disabled = false;
    setStatus("計測中");
    updateTimes();
    updateSaveButton();
    resultEl.textContent = "";
  });

  btnEnd.addEventListener("click", () => {
    endAt = new Date();
    btnEnd.disabled = true;
    setStatus("完了（保存してください）");
    updateTimes();
    updateSaveButton();
  });

  btnAddStop.addEventListener("click", addStop);
  btnClearStops.addEventListener("click", clearStops);

  btnSave.addEventListener("click", async () => {
    const s = getSettings();
    if (!s.staffName || !s.endpoint) {
      resultEl.innerHTML = `<span class="ng">⚙でスタッフ名と送信先URLを設定してください</span>`;
      return;
    }
    if (!(startAt && endAt)) {
      resultEl.innerHTML = `<span class="ng">出発→帰社を押してください</span>`;
      return;
    }
    const validStops = stops
      .map((st, idx) => ({
        stop_no: idx + 1,
        facility: (st.facility || "").trim(),
        cases: Number(st.cases || 0),
        on_site_set: st.on_site_set || ""
      }))
      .filter(st => st.facility !== "")
      .slice(0, MAX_STOPS);

    if (!validStops.length) {
      resultEl.innerHTML = `<span class="ng">施設を1件以上入力してください</span>`;
      return;
    }

    const payload = {
      date: fmtDate(new Date()),
      weekday: weekdays[new Date().getDay()],
      store: s.store || "",
      staff_name: s.staffName || "",
      memo: memoEl.value || "",
      depart_time: startAt.toISOString(),
      return_time: endAt.toISOString(),
      duration_min: Math.max(0, Math.round((endAt - startAt) / 60000)),
      stops: validStops
    };

    btnSave.disabled = true;
    resultEl.textContent = "送信中…";

    try {
      const res = await fetch(s.endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const txt = await res.text();
      if (!res.ok) throw new Error(txt || "送信に失敗");

      resultEl.innerHTML = `<span class="ok">送信完了</span>`;
      // reset
      startAt = null; endAt = null; memoEl.value = "";
      btnStart.disabled = false; btnEnd.disabled = true;
      setStatus("未開始"); updateTimes();
      stops = []; addStop();
      updateSaveButton();
    } catch (e) {
      resultEl.innerHTML = `<span class="ng">エラー：${String(e.message || e)}</span>`;
      updateSaveButton();
    }
  });

  btnSaveSettings.addEventListener("click", () => {
    const next = {
      store: storeEl.value,
      staffName: staffNameEl.value.trim(),
      endpoint: endpointEl.value.trim()
    };
    if (!next.staffName) { alert("スタッフ名は必須です"); return; }
    if (!next.endpoint) { alert("送信先URL（GAS）は必須です"); return; }
    setSettings(next);
    updateWho();
    loadFacilitiesFromGAS();
    toggleSettings(); // 閉じる
    updateSaveButton();
  });

  // boot
  (function boot(){
    const s = getSettings();
    if (s.store) storeEl.value = s.store;
    if (s.staffName) staffNameEl.value = s.staffName;
    if (s.endpoint) endpointEl.value = s.endpoint;

    updateWho();
    updateTimes();
    addStop(); // 初期1件
    updateStopCount();
    updateSaveButton();
    loadFacilitiesFromGAS();
  })();
</script>
</body>
</html>
