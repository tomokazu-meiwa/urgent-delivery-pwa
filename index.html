<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>至急配薬ログ</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  margin:0;background:#f6f7f8;color:#111;
}
header{
  background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #e6e6e6;position:sticky;top:0;z-index:10;
}
.wrap{padding:16px;max-width:560px;margin:0 auto;}
.card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:14px;margin-bottom:12px;}
.row{display:flex;gap:10px;}
.row>div{flex:1;}
label{display:block;font-size:12px;color:#555;margin-bottom:6px;}
input,select,textarea{
  width:100%;padding:10px 12px;font-size:16px;border:1px solid #d9d9d9;border-radius:10px;
}
textarea{min-height:64px;}
button{
  width:100%;padding:14px 12px;font-size:16px;border-radius:12px;
  border:1px solid #d9d9d9;background:#fff;
}
button.primary{background:#111;color:#fff;border-color:#111;}
button:disabled{opacity:.45;}
.meta{font-size:14px;line-height:1.7;}
.status{font-weight:700;}
.hint{font-size:12px;color:#777;margin-top:6px;word-break:break-all;}
.ok{color:#0a7a2f;}
.ng{color:#c01919;}
.stop{border:1px solid #ececec;border-radius:12px;padding:12px;margin-top:10px;}
.stopHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pill{font-size:12px;background:#f0f0f0;padding:4px 8px;border-radius:999px}

/* 設定モーダル */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;z-index:999;
}
.modal{
  width:100%;max-width:520px;background:#fff;border-radius:16px;
  box-shadow:0 12px 28px rgba(0,0,0,.18);
}
.modalHead{
  padding:14px;border-bottom:1px solid #eee;
  display:flex;justify-content:space-between;align-items:center;font-weight:700;
}
.modalBody{padding:14px;}
</style>

<script>
function openSettings(){document.getElementById("settingsOverlay").style.display="flex";}
function closeSettings(){document.getElementById("settingsOverlay").style.display="none";}
</script>
</head>

<body>
<header>
  <div>至急配薬ログ</div>
  <button style="width:auto" onclick="openSettings()">⚙</button>
</header>

<div class="wrap">

<div class="card">
  <div class="meta">
    今日：<span id="today"></span><br>
    スタッフ：<span id="who">（未設定）</span><br>
    ステータス：<span class="status" id="status">未開始</span>
  </div>
  <div class="hint" id="facilityLoadStatus"></div>
</div>

<div class="card">
  <div class="meta">
    出発：<span id="startTime">--:--</span><br>
    帰社：<span id="endTime">--:--</span><br>
    所要：<span id="duration">--</span> 分
  </div>
  <div class="row" style="margin-top:10px">
    <button class="primary" id="btnStart">🚑 出発</button>
    <button id="btnEnd" disabled>🏁 帰社</button>
  </div>
</div>

<div class="card">
  <div class="stopHead">
    <div class="meta">施設明細（最大5）</div>
    <div class="pill" id="stopCount">0/5</div>
  </div>
  <datalist id="facilityList"></datalist>
  <div id="stops"></div>
  <div class="row" style="margin-top:10px">
    <button id="btnAddStop">＋追加</button>
    <button id="btnClearStops">クリア</button>
  </div>
</div>

<div class="card">
  <label>メモ</label>
  <textarea id="memo"></textarea>
</div>

<div class="card">
  <button class="primary" id="btnSave" disabled>💾 保存</button>
  <div class="hint" id="result"></div>
</div>

</div>

<!-- 設定 -->
<div class="overlay" id="settingsOverlay" onclick="closeSettings()">
<div class="modal" onclick="event.stopPropagation()">
<div class="modalHead">
  <div>設定</div>
  <button onclick="closeSettings()">閉じる</button>
</div>
<div class="modalBody">
  <label>スタッフ名</label>
  <input id="staffName">
  <label style="margin-top:10px">GAS WebアプリURL</label>
  <input id="endpoint" placeholder="https://script.google.com/macros/s/XXXX/exec">
  <div class="row" style="margin-top:12px">
    <button class="primary" id="btnSaveSettings">保存</button>
  </div>
</div>
</div>
</div>

<script>
const el=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmtTime=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const fmtDate=d=>d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate());
const today=new Date();
el("today").textContent=fmtDate(today);

let startAt=null,endAt=null,stops=[],facilities=[];
const MAX=5;

function loadSettings(){
  return JSON.parse(localStorage.getItem("urgentSettings")||"{}");
}
function saveSettings(s){
  localStorage.setItem("urgentSettings",JSON.stringify(s));
}

function loadFacilities(){
  const s=loadSettings();
  if(!s.endpoint){
    el("facilityLoadStatus").innerHTML='<span class="ng">⚙でGAS URLを設定してください</span>';
    return;
  }
  const sep=s.endpoint.includes("?")?"&":"?";
  const cb="cb_"+Math.random().toString(16).slice(2);
  const url=s.endpoint+sep+"callback="+cb+"&_ts="+Date.now();
  el("facilityLoadStatus").innerHTML="施設マスタ読込中…<br>"+url;

  window[cb]=list=>{
    facilities=list||[];
    el("facilityList").innerHTML="";
    facilities.forEach(f=>{
      const o=document.createElement("option");o.value=f;el("facilityList").appendChild(o);
    });
    el("facilityLoadStatus").innerHTML='<span class="ok">施設マスタ読み込み：'+facilities.length+'件</span>';
    delete window[cb];
  };

  const sc=document.createElement("script");
  sc.src=url;
  sc.onerror=()=>{
    el("facilityLoadStatus").innerHTML='<span class="ng">施設マスタ読込失敗</span><br>'+url;
    delete window[cb];
  };
  document.body.appendChild(sc);
}

function renderStops(){
  el("stops").innerHTML="";
  stops.forEach((s,i)=>{
    const d=document.createElement("div");d.className="stop";
    d.innerHTML=`
      <label>施設</label>
      <input list="facilityList" value="${s.facility||""}" data-i="${i}" data-f="facility">
      <div class="row" style="margin-top:8px">
        <div><label>件数</label><input type="number" value="${s.cases||1}" data-i="${i}" data-f="cases"></div>
        <div><label>現地セット</label>
          <select data-i="${i}" data-f="set">
            <option value="">未</option>
            <option value="あり"${s.set==="あり"?" selected":""}>あり</option>
            <option value="なし"${s.set==="なし"?" selected":""}>なし</option>
          </select>
        </div>
      </div>`;
    el("stops").appendChild(d);
  });
  el("stopCount").textContent=stops.length+"/"+MAX;
  document.querySelectorAll("[data-f]").forEach(x=>{
    x.oninput=()=>{
      const i=x.dataset.i,f=x.dataset.f;
      stops[i][f]=x.value;
      updateSave();
    };
  });
}

function updateSave(){
  const s=loadSettings();
  el("btnSave").disabled=!(s.staffName&&s.endpoint&&startAt&&endAt&&stops.some(x=>x.facility));
}

el("btnStart").onclick=()=>{
  startAt=new Date();endAt=null;
  el("startTime").textContent=fmtTime(startAt);
  el("status").textContent="計測中";
  el("btnStart").disabled=true;
  el("btnEnd").disabled=false;
};

el("btnEnd").onclick=()=>{
  endAt=new Date();
  el("endTime").textContent=fmtTime(endAt);
  el("duration").textContent=Math.round((endAt-startAt)/60000);
  el("status").textContent="完了";
  el("btnEnd").disabled=true;
  updateSave();
};

el("btnAddStop").onclick=()=>{
  if(stops.length<MAX){stops.push({});renderStops();}
};
el("btnClearStops").onclick=()=>{stops=[];renderStops();updateSave();};

el("btnSaveSettings").onclick=()=>{
  const s={staffName:el("staffName").value.trim(),endpoint:el("endpoint").value.trim()};
  if(!s.staffName||!s.endpoint){alert("必須項目です");return;}
  saveSettings(s);
  el("who").textContent=s.staffName;
  closeSettings();
  loadFacilities();
};

el("btnSave").onclick=async()=>{
  const s=loadSettings();
  const payload={
    date:fmtDate(new Date()),
    staff:s.staffName,
    start:startAt.toISOString(),
    end:endAt.toISOString(),
    stops:stops
  };
  el("result").textContent="送信中…";
  try{
    await fetch(s.endpoint,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
    el("result").innerHTML='<span class="ok">送信完了</span>';
    startAt=endAt=null;stops=[];renderStops();updateSave();
    el("btnStart").disabled=false;
  }catch(e){
    el("result").innerHTML='<span class="ng">送信失敗</span>';
  }
};

(function boot(){
  const s=loadSettings();
  if(s.staffName) el("who").textContent=s.staffName;
  if(s.endpoint) el("endpoint").value=s.endpoint;
  if(s.staffName) el("staffName").value=s.staffName;
  stops.push({});
  renderStops();
  loadFacilities();
})();
</script>
</body>
</html>
